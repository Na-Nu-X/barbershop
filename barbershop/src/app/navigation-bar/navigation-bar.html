<nav class="navigation_bar" aria-label="Hlavná navigácia">
    <div class="navigation_container">
        <button class="hamburger" type="button" aria-controls="navigation_links" [attr.aria-expanded]="is_open" [attr.aria-label]="is_open ? 'Zavrieť menu' : 'Otvoriť menu'" (click)="toggleMenu()">
            <i class="fa-solid" [class.fa-bars]="!is_open" [class.fa-xmark]="is_open" aria-hidden="true"></i> <!-- https://fontawesome.com/icons/bars / https://fontawesome.com/icons/xmark -->
        </button>

        <ul id="navigation_links" [class.open]="is_open">
            @for (link of links; track link.label) {
                <li><a [href]="link.section ? '#' + link.section : '/'" (click)="navigate($event, link.section)">{{ link.label }}</a></li>
            }
        </ul>
    </div>
</nav>
